# Push-based deployment on the home host (which keeps a git clone of this repo, e.g. /root/car-record):
#   CI tag vX.Y.Z (.github/workflows/docker-publish.yml) -> builds & pushes image -> SSHes to host -> runs deploy/deploy.sh vX.Y.Z
#   Manual deploy / rollback on the host: /root/car-record/deploy/deploy.sh vX.Y.Z
#
# If the GitHub package is private, log in once first:
#   echo <PAT with read:packages> | docker login ghcr.io -u Ponywen0819 --password-stdin
#
# To build locally instead of pulling: docker compose up -d --build
#
# Database: your existing Postgres (12+). Create a dedicated database once, e.g.
#   CREATE ROLE car_record LOGIN PASSWORD 'change-me';
#   CREATE DATABASE car_record OWNER car_record;
# Tables are created / migrated automatically on startup.
#
# Settings go in deploy/.env on the host (cp .env.example .env && chmod 600 .env).
# Nothing secret is stored here:
#   DATABASE_URL  required, e.g. postgres://car_record:secret@db-host:5432/car_record
#                 (a host the container can reach — not localhost)
#   API_TOKEN     optional; when set, /api/* needs "Authorization: Bearer <token>"
#   APP_TAG       maintained automatically by deploy/deploy.sh (defaults to latest)
services:
  car-record:
    image: ghcr.io/ponywen0819/car-record:${APP_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: car-record
    pull_policy: always
    ports:
      - "8080:8080"
    volumes:
      # Photos live here; all records live in Postgres. Back up both
      # (records: pg_dump "$DATABASE_URL" > car-record.sql).
      # A named volume (not a ./data bind mount) so it is created owned by the
      # container's non-root `node` user. Back it up with:
      #   docker run --rm -v car-record-data:/data -v "$PWD":/backup busybox tar czf /backup/car-record.tgz -C /data .
      - car-record-data:/data
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (see the comment at the top of this file)}
      API_TOKEN: ${API_TOKEN:-}
    restart: unless-stopped

volumes:
  car-record-data:
    name: car-record-data
